<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conformidade Fiscal & Obrigações — Voal Consult</title>
  <meta name="description" content="Calendário de Obrigações Fiscais e Apurações — Voal Consult">
  
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="conformidade">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>

  <div id="app-container">
    
    <!-- BARRA LATERAL -->
    <aside class="sidebar" id="sidebar-mount"></aside>
    <script src="js/sidebar.js"></script>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-content">
      <header class="top-header no-print">
        <div class="header-left">
          <button class="sidebar-collapse-btn" title="Menu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
          </button>
          <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">
            Voal Consult &bull; Conformidade Fiscal
          </div>
        </div>
      </header>

      <div class="page-container">
        <div class="dashboard-header">
          <div class="dashboard-title">
            <h1>Conformidade Fiscal & Obrigações Acessórias</h1>
            <p>Competência em apuração: <strong id="ob-view-competence-title" style="color:var(--primary-blue);">Agosto de 2026</strong></p>
          </div>
        </div>

        <div class="kpi-grid">
          <div class="kpi-card"><div class="kpi-label">Total de Declarações</div><div class="kpi-value" id="ob-stat-total">18</div></div>
          <div class="kpi-card"><div class="kpi-label">Transmitidas</div><div class="kpi-value" id="ob-stat-done" style="color:#10B981;">15</div></div>
          <div class="kpi-card"><div class="kpi-label">Pendentes</div><div class="kpi-value" id="ob-stat-pending" style="color:#F59E0B;">3</div></div>
          <div class="kpi-card"><div class="kpi-label">Vencidas</div><div class="kpi-value" id="ob-stat-overdue" style="color:#EF4444;">0</div></div>
        </div>

        <div class="table-container">
          <table class="figma-table">
            <thead>
              <tr>
                <th>Obrigação / Código</th>
                <th>Empresa / Cliente</th>
                <th>Prazo Limite de Entrega</th>
                <th>Situação</th>
                <th>Nº Protocolo</th>
                <th style="text-align: right;">Ação</th>
              </tr>
            </thead>
            <tbody id="obligations-table-tbody">
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-deck"></div>

  <script src="js/validators.js"></script>
  <script src="js/data.js"></script>
  <script src="js/obligations.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
