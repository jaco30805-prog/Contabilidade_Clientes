<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Voal Consult</title>
  <meta name="description" content="Acesso restrito à equipe — Voal Consult">
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-app);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 32px 28px;
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .login-brand-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      background: var(--primary-blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .login-brand h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
    }
    .login-brand span {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .login-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .login-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .login-form-view { display: none; }
    .login-form-view.active { display: block; }
    .login-error {
      display: none;
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #B91C1C;
      font-size: 0.78rem;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
    }
    .login-info {
      display: none;
      background: #ECFDF5;
      border: 1px solid #6EE7B7;
      color: #047857;
      font-size: 0.78rem;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
    }
    .login-links {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
    }
    .login-links a {
      color: var(--primary-blue);
      cursor: pointer;
      text-decoration: none;
    }
    .login-links a:hover { text-decoration: underline; }
    .login-submit { width: 100%; justify-content: center; margin-top: 6px; }
  </style>
</head>
<body data-page="login">

  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h10"/><path d="M7 12h10"/><path d="M7 17h10"/></svg>
        </div>
        <div>
          <h1>Voal Consult</h1>
          <span>ERP &amp; Gestão Contábil</span>
        </div>
      </div>

      <!-- LOGIN -->
      <div id="view-login" class="login-form-view active">
        <div class="login-title">Acesso restrito à equipe</div>
        <div class="login-subtitle">Entre com sua conta para continuar.</div>
        <div class="login-error" id="login-error"></div>
        <form id="login-form">
          <div class="field-group" style="margin-bottom:12px;">
            <label>E-mail</label>
            <input type="email" id="login-email" class="form-control" required autocomplete="username">
          </div>
          <div class="field-group" style="margin-bottom:6px;">
            <label>Senha</label>
            <input type="password" id="login-password" class="form-control" required autocomplete="current-password">
          </div>
          <div class="login-links">
            <a id="link-forgot">Esqueci minha senha</a>
          </div>
          <button type="submit" class="btn-figma-primary login-submit" id="btn-login-submit">Entrar</button>
        </form>
      </div>

      <!-- ESQUECI MINHA SENHA -->
      <div id="view-forgot" class="login-form-view">
        <div class="login-title">Recuperar acesso</div>
        <div class="login-subtitle">Informe seu e-mail cadastrado. Enviaremos um link para redefinir a senha.</div>
        <div class="login-error" id="forgot-error"></div>
        <div class="login-info" id="forgot-info"></div>
        <form id="forgot-form">
          <div class="field-group" style="margin-bottom:14px;">
            <label>E-mail</label>
            <input type="email" id="forgot-email" class="form-control" required autocomplete="username">
          </div>
          <button type="submit" class="btn-figma-primary login-submit" id="btn-forgot-submit">Enviar link de redefinição</button>
        </form>
        <div class="login-links" style="justify-content:flex-start; margin-top:16px;">
          <a id="link-back-login">&larr; Voltar para o login</a>
        </div>
      </div>

      <!-- DEFINIR NOVA SENHA (chegou aqui pelo link do e-mail) -->
      <div id="view-recovery" class="login-form-view">
        <div class="login-title">Defina sua nova senha</div>
        <div class="login-subtitle">Escolha uma nova senha para sua conta.</div>
        <div class="login-error" id="recovery-error"></div>
        <form id="recovery-form">
          <div class="field-group" style="margin-bottom:14px;">
            <label>Nova senha</label>
            <input type="password" id="recovery-password" class="form-control" minlength="6" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn-figma-primary login-submit" id="btn-recovery-submit">Salvar nova senha</button>
        </form>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function showView(id) {
      document.querySelectorAll('.login-form-view').forEach(v => v.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showMessage(elId, message) {
      const el = document.getElementById(elId);
      el.textContent = message;
      el.style.display = 'block';
    }

    function hideMessage(elId) {
      const el = document.getElementById(elId);
      el.style.display = 'none';
    }

    function traduzErro(msg) {
      if (!msg) return 'Não foi possível concluir. Tente novamente.';
      if (/invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
      if (/email not confirmed/i.test(msg)) return 'E-mail ainda não confirmado.';
      return msg;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // Nunca redireciona automaticamente aqui: quem chega pelo link de
      // recuperação de senha também passa por uma sessão válida, e não pode
      // ser jogado pro dashboard antes de definir a nova senha.
      await Auth.init();

      sb.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') {
          showView('view-recovery');
        }
      });

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage('login-error');
        const btn = document.getElementById('btn-login-submit');
        btn.disabled = true;
        btn.textContent = 'Entrando...';

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const { error } = await Auth.signIn(email, password);

        if (error) {
          showMessage('login-error', traduzErro(error.message));
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return;
        }
        window.location.replace('index.html');
      });

      document.getElementById('link-forgot').addEventListener('click', (e) => {
        e.preventDefault();
        hideMessage('forgot-error');
        hideMessage('forgot-info');
        showView('view-forgot');
      });

      document.getElementById('link-back-login').addEventListener('click', (e) => {
        e.preventDefault();
        showView('view-login');
      });

      document.getElementById('forgot-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage('forgot-error');
        hideMessage('forgot-info');
        const btn = document.getElementById('btn-forgot-submit');
        btn.disabled = true;
        btn.textContent = 'Enviando...';

        const email = document.getElementById('forgot-email').value.trim();
        const { error } = await Auth.requestPasswordReset(email);

        btn.disabled = false;
        btn.textContent = 'Enviar link de redefinição';

        // Mensagem genérica sempre — não confirma se o e-mail existe ou não
        // na base, para não vazar quais e-mails têm conta no sistema.
        if (error) console.error(error);
        showMessage('forgot-info', 'Se este e-mail estiver cadastrado, você receberá um link para redefinir a senha em instantes.');
      });

      document.getElementById('recovery-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage('recovery-error');
        const btn = document.getElementById('btn-recovery-submit');
        btn.disabled = true;
        btn.textContent = 'Salvando...';

        const password = document.getElementById('recovery-password').value;
        const { error } = await Auth.updatePassword(password);

        if (error) {
          showMessage('recovery-error', traduzErro(error.message));
          btn.disabled = false;
          btn.textContent = 'Salvar nova senha';
          return;
        }
        window.location.replace('index.html');
      });
    });
  </script>
</body>
</html>
